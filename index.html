<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>みりょく発見ナビ</title>
<style>
/* 案A「すごろく型」（設計メモ/児童用サイト_レイアウト案/）。iPad 横向きが主、縦向きでもくずれない */
:root {
  --bg: #f7f5f0; --card: #ffffff; --ink: #222; --sub: #666; --line: #ddd8cc;
  --c1: #2f6fb5; --c1s: #e6effa;   /* 読んで見つける ①〜④ */
  --c2: #2e8b57; --c2s: #e3f3ea;   /* 材料を集める ⑤〜⑧ */
  --c3: #d9822b; --c3s: #fdf0e1;   /* 書いて伝える ⑨⑩ */
  --help: #b3261e; --helps: #fde8e6; --fu: #fff4b8; --fuline: #e0b800;
  --c: var(--c1); --cs: var(--c1s);  /* いまのページの色 */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  font-size: 19px; line-height: 1.7;
}
a { color: inherit; text-decoration: none; }
b { font-weight: 700; }

/* ---------- 上：すごろくの帯 ---------- */
header.top { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
.top-in { max-width: 1140px; margin: 0 auto; padding: 6px 16px 4px; display: flex; align-items: center; gap: 4px 18px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; line-height: 1.35; }
.brand a { font-weight: 700; font-size: 18px; }
.legend { display: flex; flex-direction: column; font-size: 12px; color: var(--sub); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: 0; }
nav.board { display: flex; flex: 1 1 auto; justify-content: center; overflow-x: auto; padding: 18px 0 2px; scrollbar-width: none; }
nav.board::-webkit-scrollbar { display: none; }
.sq { flex: 0 0 auto; width: 84px; display: flex; flex-direction: column; align-items: center; position: relative; }
.sq::before { content: ""; position: absolute; top: 19px; left: -42px; width: 84px; height: 5px; background: #d6d2c8; }
.sq:first-child::before { display: none; }
.sq .n { width: 42px; height: 42px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; background: var(--pc); }
.sq .w { font-size: 12px; line-height: 1.3; text-align: center; margin-top: 3px; color: var(--sub); }
.sq.done .n { opacity: .45; }
.sq.now .n { width: 50px; height: 50px; margin-top: -4px; font-size: 21px; box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--pc); }
.sq.now .w { color: var(--ink); font-weight: 700; margin-top: 6px; }
.sq.now .flag { position: absolute; top: -20px; z-index: 2; background: var(--ink); color: #fff; font-size: 11px; border-radius: 6px; padding: 0 7px; white-space: nowrap; line-height: 1.6; }
.p1 { --pc: var(--c1); --ps: var(--c1s); } .p2 { --pc: var(--c2); --ps: var(--c2s); } .p3 { --pc: var(--c3); --ps: var(--c3s); }

main { max-width: 1140px; margin: 0 auto; padding: 14px 16px 24px; }

/* ---------- 下：いつでも同じ場所のボタン ---------- */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.bottom .in { max-width: 1140px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.bottom a { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 66px; font-size: 14px; color: var(--sub); padding: 4px 2px; text-align: center; line-height: 1.25; }
nav.bottom a .ic { font-size: 24px; line-height: 1.2; }
nav.bottom a.on { color: var(--c); font-weight: 700; box-shadow: inset 0 5px 0 var(--c); }
nav.bottom a.help { background: var(--helps); color: var(--help); font-weight: 700; }
nav.bottom a.help.on { box-shadow: inset 0 5px 0 var(--help); }

/* ---------- 共通の部品 ---------- */
h1 { font-size: 25px; margin: 4px 0 12px; line-height: 1.4; }
h2 { font-size: 21px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; line-height: 1.4; }
h2 .ic { flex: 0 0 32px; height: 32px; border-radius: 10px; background: var(--c); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; }
.note { color: var(--sub); font-size: 16px; margin: 6px 4px; }
.meate { background: var(--cs); border: 3px solid var(--c); border-radius: 18px; padding: 12px 18px; }
.meate .lbl { display: inline-block; background: var(--c); color: #fff; font-size: 15px; font-weight: 700; border-radius: 999px; padding: 0 12px; }
.meate .t { font-size: 24px; font-weight: 700; line-height: 1.5; margin-top: 4px; }
.meate-note { color: var(--sub); font-size: 16px; margin: 6px 4px 0; }
.pg { display: inline-block; white-space: nowrap; background: var(--cs); color: var(--c); font-weight: 700; border-radius: 8px; padding: 0 7px; margin: 0 1px; }
.mono { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
.mono span { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 3px 12px; font-size: 16px; font-weight: 700; }
.mono span::before { content: "📄 "; }
.mono span.book::before { content: "📕 "; }

.step { display: flex; gap: 14px; align-items: flex-start; background: #fff; border-radius: 16px; padding: 12px 16px; margin-bottom: 9px; box-shadow: 0 1px 0 var(--line); }
.step .k { flex: 0 0 38px; height: 38px; border-radius: 50%; background: var(--c); color: #fff; font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.step.pair { border-left: 8px solid var(--c3); }
.step .who { display: inline-block; white-space: nowrap; font-size: 14px; font-weight: 700; color: var(--c3); border: 2px solid var(--c3); border-radius: 999px; padding: 0 8px; margin-left: 6px; line-height: 1.5; vertical-align: 1px; }

details.hint { margin-top: 14px; }
details.hint summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: var(--fu); border: 3px dashed var(--fuline); border-radius: 16px; padding: 12px 18px; font-weight: 700; font-size: 21px; min-height: 64px; }
details.hint summary::-webkit-details-marker { display: none; }
details.hint summary small { font-weight: 400; font-size: 15px; color: var(--sub); margin-left: 6px; }
details.hint summary::after { content: "＋"; font-size: 24px; }
details.hint[open] summary::after { content: "－"; }
details.hint[open] summary { border-style: solid; border-radius: 16px 16px 0 0; }
.fus { background: #fffbe2; border: 3px solid var(--fuline); border-top: 0; border-radius: 0 0 16px 16px; padding: 10px 12px 4px; }
.fu { background: var(--fu); border-radius: 4px 4px 14px 4px; padding: 9px 14px; margin-bottom: 10px; box-shadow: 2px 3px 0 rgba(0, 0, 0, .07); }
.fu::before { content: "💡 "; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.tiles a { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 700; min-height: 64px; line-height: 1.4; }
.tiles a .e { font-size: 26px; }
.tiles a small { display: block; font-weight: 400; color: var(--sub); font-size: 14px; }
.tiles a.help { background: var(--helps); border-color: var(--help); color: var(--help); }
.tiles a:active, .sq:active, button:active, .kb:active { transform: translateY(1px); }

.say { display: flex; flex-direction: column; gap: 8px; }
.say div { background: #fff; border: 2px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 8px 16px; font-size: 20px; }
.say div.ask { border-color: var(--c3); background: var(--c3s); border-radius: 16px 16px 4px 16px; margin-left: 2em; }
.blank { display: inline-block; min-width: 4em; border-bottom: 2px solid var(--ink); }

.menu5 { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.menu5 div { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; line-height: 1.5; }
.menu5 div b { display: block; font-size: 20px; color: var(--c); }
.menu5 div.must-box { border: 3px solid var(--help); background: var(--helps); }
.menu5 div.must-box b { color: var(--help); }

.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
.pn a { display: block; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px 16px; min-height: 64px; font-weight: 700; }
.pn a small { display: block; font-weight: 400; color: var(--sub); font-size: 14px; }
.pn a.nx { text-align: right; border-color: var(--c); }

/* 時間のページ：横向きは2列（左＝やること、右＝使うもの・ヒント・ほかのページ） */
.cols { display: grid; grid-template-columns: 1fr; gap: 0 22px; }
@media (min-width: 1000px) {
  .cols { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; }
  .cols .right { position: sticky; top: calc(var(--hd, 110px) + 10px); }
  .cols .right h2:first-child { margin-top: 22px; }
}

/* ホーム */
.back { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--cs); border: 2px solid var(--c); border-radius: 14px; padding: 10px 16px; font-weight: 700; margin-bottom: 12px; min-height: 60px; }
.goal { background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 12px 18px; font-size: 22px; font-weight: 700; line-height: 1.5; }
.goal .lbl { display: inline-block; background: var(--ink); color: #fff; font-size: 15px; border-radius: 999px; padding: 0 12px; margin-right: 8px; vertical-align: 3px; }
.phase { margin-top: 16px; }
.phase .ph { font-size: 16px; font-weight: 700; color: var(--pc); margin: 0 4px 6px; }
.lt { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.lt a { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--line); border-left: 8px solid var(--pc); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 20px; min-height: 70px; line-height: 1.35; }
.lt a .n { flex: 0 0 auto; min-width: 46px; height: 46px; padding: 0 6px; border-radius: 23px; background: var(--pc); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 19px; }
.lt a.last { background: var(--ps); }

/* 困ったとき：左にこまりごと、右に使えるもの */
.kgrid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 900px) { .kgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: start; } .kpanel { position: sticky; top: calc(var(--hd, 110px) + 10px); } }
.klist { display: flex; flex-direction: column; gap: 8px; }
button.kb { font: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; min-height: 60px; font-weight: 700; font-size: 18px; color: var(--ink); line-height: 1.4; }
button.kb .e { font-size: 24px; flex: 0 0 auto; }
button.kb.on { border: 3px solid var(--help); background: var(--helps); }
.kpanel { background: #fff; border: 3px solid var(--help); border-radius: 18px; padding: 14px 18px; min-height: 200px; }
.kpanel h3 { margin: 0 0 8px; color: var(--help); font-size: 21px; line-height: 1.4; }
.kpanel ol { margin: 0; padding-left: 1.4em; }
.kpanel li { margin-bottom: 8px; }
.kpanel .empty { color: var(--sub); }

/* 道具箱・型・きまり */
.jump { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; position: sticky; top: var(--hd, 110px); background: var(--bg); z-index: 4; }
.jump a { flex: 0 0 auto; border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 15px; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
h2[id] { scroll-margin-top: calc(var(--hd, 110px) + 60px); }
table.t { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
table.t th, table.t td { background: #fff; padding: 8px 14px; text-align: left; vertical-align: top; }
table.t th { width: 8em; background: var(--cs); color: var(--c); white-space: nowrap; border-radius: 12px 0 0 12px; }
table.t td { border-radius: 0 12px 12px 0; }
.kata { display: grid; grid-template-columns: 1fr; gap: 10px; }
.kata .card { background: #fff; border-radius: 16px; padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: center; box-shadow: 0 1px 0 var(--line); }
.kata .no { display: inline-block; font-weight: 700; color: #fff; background: var(--c); border-radius: 999px; padding: 0 12px; font-size: 16px; }
.kata .bun { font-size: 20px; font-weight: 700; margin-top: 4px; }
.kata .muku { color: var(--sub); font-size: 16px; margin-top: 4px; }
.zu { display: flex; flex-direction: column; gap: 4px; }
.zu div { border: 2px solid var(--line); border-radius: 10px; padding: 3px 10px; font-size: 16px; display: flex; gap: 8px; }
.zu div b { color: var(--sub); font-weight: 400; min-width: 3em; }
.zu div.star { border-color: var(--c3); background: var(--c3s); font-weight: 700; }
.must { color: var(--help); font-weight: 700; }
.gates { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.gate { background: #fff; border: 3px solid var(--c2); border-radius: 18px 18px 12px 12px; padding: 0 0 10px; overflow: hidden; }
.gate h3 { margin: 0 0 6px; background: var(--c2); color: #fff; padding: 4px 14px; font-size: 19px; }
.gate div { padding: 0 14px; }
.gate .note { margin: 4px 14px 0; padding: 0; }
ul.list { list-style: none; padding: 0; margin: 0; }
ul.list li { background: #fff; border-radius: 12px; padding: 8px 14px 8px 40px; margin-bottom: 6px; position: relative; }
ul.list li::before { content: "▶"; position: absolute; left: 14px; color: var(--c); font-size: 14px; top: 11px; }

footer { max-width: 1140px; margin: 0 auto; padding: 0 16px calc(90px + env(safe-area-inset-bottom)); color: var(--sub); font-size: 13px; }

@media (max-width: 999px) {
  .brand { flex-direction: row; align-items: baseline; gap: 14px; width: 100%; }
  .legend { flex-direction: row; gap: 10px; }
  nav.board { padding-top: 22px; }
}
@media (max-width: 700px) {
  body { font-size: 17px; }
  h1 { font-size: 22px; }
  .meate .t { font-size: 20px; }
  .legend { display: none; }
  .kata .card { grid-template-columns: 1fr; }
  table.t th { width: auto; white-space: normal; }
  nav.bottom a { font-size: 11px; }
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><a href="#/">みりょく発見ナビ</a>
    <div class="legend"><span><i style="background:var(--c1)"></i>読んで見つける</span><span><i style="background:var(--c2)"></i>材料を集める</span><span><i style="background:var(--c3)"></i>書いて伝える</span></div>
  </div>
  <nav class="board" id="board" aria-label="学習のすごろく"></nav>
</div></header>
<main id="main"></main>
<nav class="bottom" id="bottom" aria-label="いつでも使うページ"><div class="in" id="bottomIn"></div></nav>
<footer>この学習のための手引きです。教科書を開いて、いっしょに使いましょう。</footer>
<script>
const D = {"unit": {"題": "筆者の工夫をとらえて読み、それをいかして書こう", "教材": "「『鳥獣戯画』を読む」「発見、日本文化のみりょく」（教科書 155〜169ページ）", "ゴール": "自分がえらんだ日本文化のよさを、おうちの人や地域の人に伝える文章を書いて、読み合う。（授業参観で、ろう下にはり出します）"}, "lessons": [{"id": "1", "番号": "①", "見出し": "見通しをもつ", "紙": ["WS01", "ロードマップ"], "めあて": "学習のゴールをたしかめ、ゴールまでの見通しをもとう。", "やること": ["155ページの絵を見て、気づいたことを、**絵のどこか**と合わせて書く。", "ペアで、気づいたことを話す。自分では気づかなかったことを書き足す。", "「『鳥獣戯画』を読む」を読む。読み上げの音声を聞きながらでもよい。", "155ページの上の文を読んで、**単元のゴール**を書き入れる。読んでもらう相手は、**おうちの人や地域の人**。", "ロードマップを見て、WS01の３の問いに答える。", "いちばんがんばりたい時間と、そのわけを、ペアで伝え合う。"], "ヒント": ["３の問いの答えは、**ロードマップの中に書いてあります。** ロードマップをよく見ましょう。", "「読んでもらう相手」は、先生の話を聞いて書きましょう。"]}, {"id": "2", "番号": "②", "見出し": "絵と文章", "紙": ["WS02", "ロイロで配る絵"], "めあて": "絵と文章を照らし合わせて、筆者が絵のどこを取り上げているかをたしかめよう。", "やること": ["156〜162ページを音読する。", "WS02の三つの文（ア 156ページ／イ 158ページ11〜12行目／ウ 159ページ4行目）が、絵のどこのことかを、ロイロの絵にア・イ・ウで書きこむ。", "ペアで「この文は、絵のどこ？」と、**指でさして**たしかめ合う。", "160ページ1〜2行目を読んで、ロイロの絵に、時間が流れる向きを矢印で書く。", "157ページ13行目のとおりに、ページをめくってみる。", "158ページ7〜8行目を読んで、筆者がなぜ絵をわざと切りはなして見せたのかを考える。"], "ヒント": ["場所は「**だれの、どこ**」で書きます。「だれの」はどの動物か、「どこ」は体のどの部分かです。", "考えるときの書き出し：「切りはなしてあると、読む人は……」", "全部の文でなくてよい。先生が「ここ」と言った文から始めましょう。"]}, {"id": "3", "番号": "③", "見出し": "工夫を見つける", "紙": ["WS03", "ふせん"], "めあて": "筆者が『鳥獣戯画』をどう評価しているかを見つけ、それを伝えるための工夫を書き出そう。", "やること": ["164ページ上段を読んで、筆者が「**絵**」と「**絵巻物**」の二つについて、自分の評価を書いていることをたしかめる。", "筆者がすごいと思っていることが分かる言葉をさがして、線を引く。〈絵〉は156〜159ページ、〈絵巻物〉は161〜162ページ。", "筆者の工夫を、**三つの見方**でさがして書く。例は164ページ下段にあります。", "グループで出し合って、三つの見方のどれに当たるかを分ける。", "いちばん「なるほど」と思った工夫に◎をつける。"], "ヒント": ["三つの見方は「ことばの道具箱」にもあります。", "表現の工夫で見るところ：文の終わり方／話しかけ・問いかけ／短く言い切る文／様子を表す言葉。", "ふつうの説明文なら「〜である。」と書くところを、筆者はどう書いているでしょう。", "ふせんは**1まいに1つ**。1つ書けたら、次に進んでよい。", "どこをさがせばよいか分からないときは、さがす所を**1ページにしぼって**かまいません。"]}, {"id": "4", "番号": "④", "見出し": "工夫をえらぶ", "紙": ["WS04", "おすすめカード", "「読む人が〜」の型"], "めあて": "自分が書くときに使いたい筆者の工夫をえらび、なぜ効果的なのかを本文の言葉で説明しよう。", "やること": ["学級の工夫マップを見て、自分が書き出していなかった工夫を一つ書く。", "使いたい工夫を一つえらぶ。", "その工夫が分かる教科書の言葉を、**ページと行**といっしょに書く。", "その工夫で、読む人にどんなことがおこるかを書く。", "写真をとって提出箱へ出す。", "グループで1人1分半ずつ話す。左どなりの人が、かならずたずねる。", "話したあとで、変えたところを**赤ペン**で書く。"], "ヒント": ["えらべないときは、机の上の「**おすすめカード**」からえらんでよい。", "読み返すのは、前の時間にふせんをはった1〜2か所だけでよい。", "わけは「**読む人が、〜**」で書き始めましょう。（ことばの道具箱）", "書くのは短くてかまいません。"], "話し方": ["わたしがえらんだ工夫は、〜です。", "教科書 ○ページ ○行目の「　　」という言葉から、そう思いました。", "この工夫で、読む人が〜と思います。", "（聞く人）それは本文のどこから言えるの？"]}, {"id": "5-7", "番号": "⑤〜⑦", "見出し": "材料をそろえる", "紙": ["学習の手引き", "WS05", "WS06", "WS07"], "めあて": "自分の計画で学習を進め、いちばん伝えたいみりょくと、その材料をそろえよう。", "めあての注": "この3時間は、毎時間の「じぶんのめあて」を自分で書きます。", "やること": ["始める前に、今日どこまで進めるかをロードマップで決める。", "**Ａ 本を読む**（WS05）……日本文化の本を読み、初めて知ったことと、説明のしかたで「うまい」と思ったところを書く。", "**Ｂ 題材を決める**（WS06）……書く日本文化と、いちばん伝えたいみりょくを決める。168〜169ページの高橋さんの文章も読んで、できあがりの形を見ておく。", "**Ｃ 情報を集めて、整理する**（WS07）……カード1まいに、ことがら1つと、本の名前・ページを書く。集まったら311ページを見て、図に整理する。", "Ａ・Ｂ・Ｃの順番は自分で決める。ただし、**関門①②③は全員が通る。**"], "ヒント": ["関門と進め方のきまりは「**自由進度のきまり**」のページにあります。", "困ったら「**困ったときのメニュー**」を見ましょう。聞かなくても使ってよいものばかりです。", "第6時の終わりに、ペアで「いちばん伝えたいみりょく」を言い合います。それまでに関門②を通りましょう。", "第7時の終わりの15分は、全員で**5つの型**をたしかめ、自分の型を**仮にえらびます**（WS07の６）。グループで言い合います。", "どこに書いてあったか言えないことは、書きません。"]}, {"id": "8", "番号": "⑧", "見出し": "構成をえらぶ", "紙": ["構成メモ（型あり／自由）", "第4時の工夫カード", "WS07の2まい目", "赤ペン"], "めあて": "いちばん伝えたいことが伝わる構成をえらび、なぜその構成にしたのかを説明しよう。", "やること": ["WS07の６で**仮にえらんだ型**を、構成メモの「えらんだ型」に写す。めあてをたしかめる。", "今日は㋐〜㋔を**この順番で**、みんなで進む。", "はじめに㋐か㋑の**どちらかをえらぶ**。型をもう一度考えたい人は㋐、このまま組み立てる人は㋑から。", "㋐をえらんだ人も、とちゅうで㋑に進み、**自分の型で構成メモを作る**ところまでやる。", "**㋒** グループで構成メモを読み合う。1人2分で説明し、聞く人は一回問い返して、助言を一つ伝える。", "**㋓** 構成メモの写真を、ロイロの**自分がえらんだ型の提出箱**に出す。同じ型の箱を見てから、ちがう型の箱を見る。", "**㋔** 一人で、赤ペンで構成メモを書きかえる。かえたところを「３ かえたところ」に書く。", "最後に、何人かが「どこを、なぜかえたか」を発表する。"], "メニュー": [["㋐ たしかめ", "型をかえたら、どうかわる？"], ["㋑ 組み立てる", "自分の型で、構成メモをつくる（全員）"], ["㋒ 説明の関所", "グループで読み合い、助言し合う"], ["㋓ くらべる", "型べつの提出箱に出して、見くらべる"], ["㋔ 書きかえる", "一人で、赤ペンで組みかえる／型をえらび直す"]], "ヒント": ["型が合わないと思ったら、えらび直してかまいません。「えらんだ型」に**赤ペン**で印をつけ直します。", "構成メモは、文でなく**短い言葉**でかまいません。", "関所で話す言い方は「ことばの道具箱」にあります。", "もらった助言は、構成メモの空いているところに**えんぴつで**メモしておきましょう。赤ペンは㋔で使います。", "㋔は一人で考える時間です。助言のメモと、㋓で見た構成メモをもとに決めましょう。かえなかった人は、そのわけを赤で書きます。"]}, {"id": "9", "番号": "⑨", "見出し": "文章を書く", "紙": ["原こう用紙", "第4時の工夫カード", "第8時の構成メモ", "書き出しの用紙"], "めあて": "筆者の工夫を使って、えらんだ日本文化のよさが伝わる文章を書こう。", "やること": ["第4時の工夫カードと、第8時の構成メモを、机の上にならべる。", "168ページの高橋さんの文章をもう一度読んで、どんな工夫をしているかを見つける。", "第4時にえらんだ工夫を、文章の**どこで使うか**決める。", "構成メモをもとに、文章を書く。", "とちゅうで手を止めて、**書き出しだけ**をグループで読み合う。", "書き終わったら、ロイロで出す。"], "ヒント": ["書き出しに迷ったら「**書き出しの用紙**」を使ってよい。三つの形からえらべます。", "全部を一度に書かなくてよい。構成メモの**一つのらん**から書き始めましょう。", "「よさを伝えるときの言葉」は「ことばの道具箱」にあります。", "字を書くのがつらいときは、ロイロで打ってもよいか、先生に聞きましょう。"]}, {"id": "10", "番号": "⑩", "見出し": "読み合う", "紙": ["感想の型", "ロードマップ", "これまでの紙"], "めあて": "友達の文章のよいところを見つけて伝え、単元の学びをふりかえろう。", "やること": ["グループで文章を読み合う。", "よいところを「**どこが**」「**なぜ**」の二つで伝える。使っている筆者の工夫も見つける。", "169ページを見て、単元で学んだことをたしかめる。", "第4時の工夫カードと、できあがった文章をならべて、単元のふりかえりを書く。"], "ヒント": ["「よかったです」で終わりにしません。", "工夫は、教室の前にはってある三つの見方の言葉を使います。", "三つとも書けなくてよい。「どこが」と「なぜ」が書けていれば十分です。"]}], "jiyu": {"関門": [["関門①", "本から、使えそうな説明の工夫を一つ書けた", "WS05 の４が書けている。「どの本の、どこ？」に答えられる。"], ["関門②", "題材と、いちばん伝えたいみりょくが、一言で言える", "WS06 の１・２。書けていても、口で言えなければ通れません。**第6時までに。**"], ["関門③", "同じことがらを二さつでたしかめ、出典を書いた", "WS07 の４。本の名前とページが書いてある。"]], "きまり": ["順番は自分で決めます。", "始める前に、今日どこまで進めるかをロードマップで決めます。", "教室で進めても、図書館へ行ってもかまいません。", "関門の印は、先生がおします。", "どこに書いてあったか言えないことは、書きません。", "二さつの本でちがっていたら、どちらが**いつ・だれが**書いたものかを見て決めます。たしかめられないことは、書きません。"], "第8時のきまり": ["㋐〜㋔は、**この順番で**進む。はじめだけ、㋐か㋑をえらぶ。", "**㋒ 説明の関所は、きめてあるグループ（5人）で行う。** 説明する順番も、先に決めておく。", "説明は1人2分。先生の合図で、次の人に代わる。", "聞く人は、かならず一つは問い返し、助言を一つ伝える。", "とちゅうまでしか書けていなくても、書けたところまでで説明してよい。", "聞いてくれた人に、構成メモの「２ 説明の関所」の□にしるしをつけてもらう。"]}, "komatta": [{"こまりごと": "教科書の文が読めない・読むのがつらい", "使えるもの": ["**読み上げの音声**を聞いてよい。先生がロイロで配った音声を開きます。", "全部読まなくてよい。今日使う**ページと行**だけを読みましょう（その時間のページに書いてあります）。", "高橋さんの文章は、教室に**色分けした大きい紙**があります（第8時の㋐）。"]}, {"こまりごと": "筆者の工夫が見つからない", "使えるもの": ["三つの見方（論の展開・表現の工夫・絵の示し方）を1つだけえらんで、それだけでさがす。", "表現の工夫なら、**文の終わり方**だけを見ていく。「〜である。」で終わっていない文をさがす。", "164ページ下段に、見つけ方の例があります。"]}, {"こまりごと": "どの工夫をえらべばいいか決められない", "使えるもの": ["「**おすすめカード**」の三つからえらんでよい（第4時、机の上）。", "それでも決まらないときは、読んだとき、自分がいちばんおどろいた所をえらぶ。"]}, {"こまりごと": "どの本を読めばいいか分からない", "使えるもの": ["「**先生のおすすめ**」の本から選んでよい。", "**写真と説明が多い本**を選んでよい。それでも関門①は通れます（「写真や図の使い方」で見つければよい）。", "165ページ下段に、本の例があります。"]}, {"こまりごと": "題材が決まらない", "使えるもの": ["166〜167ページの題材の例（和食・和楽器・日本画・伝統芸能 など）から選んでよい。", "**相談テーブル**に行って、人に聞いてよい。", "同じ題材の友達の一覧（紙）を見てよい。", "「すごい」の中身を考える：**何が、どうすごいのか**を一言で言ってみる。"]}, {"こまりごと": "二さつ目の本が見つからない", "使えるもの": ["先生に言う。**組になる本**（同じことを別の本で書いたもの）を用意してあります。", "**先生の情報カード**を使ってよい。"]}, {"こまりごと": "集めた情報を図にまとめられない・選べない", "使えるもの": ["図の形は、教科書**311ページ**の見本から選んでよい。", "まん中に書くことを書き、線をのばして、にているものをまとめる。", "集めすぎて選べないときは、「**読む人がいちばんおどろくのはどれか**」で決める。"]}, {"こまりごと": "構成の型がえらべない", "使えるもの": ["「**5つの構成の型**」のページを見る。", "まず「わたしがいちばん伝えたいのは、〜です。」と言ってみる。それが**初めにくるか、終わりにくるか**で考える。", "決められないときは、「『初め』に『問い』を書き、それに答えていく」型から。", "グループでもらった助言や、㋓で見た同じ型の人の構成メモを参考にしてよい。（第8時）"]}, {"こまりごと": "書き出せない・何から書けばいいか分からない", "使えるもの": ["「**ことばの道具箱**」の書き出しの型を使う。", "第9時は「**書き出しの用紙**」を使ってよい。三つの形からえらべます。", "構成メモの**一つのらん**だけを見て、そこから書く。"]}, {"こまりごと": "早く終わった", "使えるもの": ["三さつ目の本を読む。別の形の図で整理し直して、二つをくらべる。（第5〜7時）", "**別の型で組み直したら**どうなるかをためして、二つをくらべる。（第8時）", "㋓で、ちがう型の箱も開いて、自分とちがう型をえらんだ人を一人見つけ、そのわけを考える。（第8時）"]}], "dougu": [{"見出し": "三つの見方（筆者の工夫）", "時間": "③〜⑩", "中身": [["論の展開", "どんな順番で書いているか／なぜその例を出したか"], ["表現の工夫", "言葉の選び方／文の終わり方／読む人への呼びかけ"], ["絵の示し方", "どの絵を、どう見せているか"]], "形": "表"}, {"見出し": "根きょの言い方", "時間": "②〜④", "中身": ["教科書 ○ページ ○行目の「　　」という言葉から、そう思いました。", "（聞く人）それは本文のどこから言えるの？"], "形": "型"}, {"見出し": "わけの書き出し「読む人が〜」", "時間": "④", "中身": ["読む人が、＿＿＿と感じるから。", "読む人が、＿＿＿を思いうかべられるから。", "読む人が、＿＿＿に引きこまれるから。", "読む人が、＿＿＿がすぐに分かるから。"], "注": "どれか一つだけえらんで、後ろを書けばよい。", "形": "型"}, {"見出し": "説明の関所 ―― 説明する人（1人2分）", "時間": "⑧", "中身": ["① わたしがえらんだのは、型＿＿です。", "② いちばん伝えたいことは、＿＿＿です。", "③ だから、＿＿＿を先に書いて、＿＿＿をくわしく書きます。", "④ ＿＿＿は、簡単に書きます。"], "注": "①②③が言えれば十分です。④は言えたら、なおよい。", "形": "型"}, {"見出し": "説明の関所 ―― 聞く人", "時間": "⑧", "中身": ["かならず聞く：「その構成で、いちばん伝えたいことが伝わる？」", "足して聞いてよい：「どこをくわしく書くの？」", "足して聞いてよい：「なぜ、その順番にしたの？」", "足して聞いてよい：「その例は、いちばん伝えたいことにつながっている？」", "助言を一つ伝える：「＿＿＿を先に書くと、分かりやすいよ。」「★のところを、もっとくわしく書くといいよ。」"], "注": "助言は、構成メモの**どこに const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* **〜** は太字、[[〜]] は小さな注記、「156ページ」「158ページ11〜12行目」などは色のついた札にする */
const PG = /(\d+(?:〜\d+)?ページ(?:\s?\d+(?:〜\d+)?行目|上段|下段)?)/g;
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[\[(.+?)\]\]/g, '<span class="note">$1</span>').replace(PG, '<span class="pg">$1</span>');

/* 3つのまとまり：①〜④ 読んで見つける／⑤〜⑧ 材料を集める／⑨⑩ 書いて伝える */
const phase = (id) => (["1", "2", "3", "4"].includes(id) ? 1 : ["5-7", "8"].includes(id) ? 2 : 3);
const PHASE_NAME = { 1: "読んで見つける", 2: "材料を集める", 3: "書いて伝える" };
const num = (l) => l.id; /* 丸の中は数字（5-7 など） */
const setColor = (p) => {
  const r = document.documentElement.style;
  r.setProperty("--c", p ? `var(--c${p})` : "var(--c1)");
  r.setProperty("--cs", p ? `var(--c${p}s)` : "var(--c1s)");
};

/* 最後に開いた時間を、この iPad の中だけで覚えておく */
const LAST = "miryoku-navi-last";
const getLast = () => { try { return localStorage.getItem(LAST) || ""; } catch (e) { return ""; } };
const setLast = (id) => { try { localStorage.setItem(LAST, id); } catch (e) {} };

function bottom(page) {
  const L = D.lessons.find((x) => x.id === getLast());
  const items = [
    ["#/", "🏠", "ホーム", page === "home", ""],
    [L ? `#/l/${L.id}` : "#/", "📍", L ? `${L["番号"]}の時間` : "今日の時間", page === "lesson", ""],
    ["#/dougu", "🧰", "ことばの道具箱", page === "dougu", ""],
    ["#/kata", "🧩", "構成の型", page === "kata", ""],
    ["#/komatta", "🆘", "困ったとき", page === "komatta", "help"],
  ];
  $("#bottomIn").innerHTML = items.map(([h, ic, t, on, c]) => `<a href="${h}" class="${c} ${on ? "on" : ""}"><span class="ic">${ic}</span>${esc(t)}</a>`).join("");
}

function board(cur) {
  const ci = D.lessons.findIndex((l) => l.id === cur);
  $("#board").innerHTML = D.lessons.map((l, i) => {
    const st = i === ci ? "now" : ci >= 0 && i < ci ? "done" : "";
    const w = esc(l["見出し"]).replace(/^(.{2,3}を)/, "$1<br>");
    return `<a href="#/l/${l.id}" class="sq p${phase(l.id)} ${st}">${st === "now" ? '<span class="flag">いまここ</span>' : ""}<span class="n">${esc(num(l))}</span><span class="w">${w}</span></a>`;
  }).join("");
  const on = $("#board .now");
  if (on) on.scrollIntoView({ block: "nearest", inline: "center" });
}

const list = (arr) => `<ul class="list">${arr.map((x) => `<li>${md(x)}</li>`).join("")}</ul>`;
const PAIR = /ペア|グループ/;
const steps = (arr) => arr.map((x, i) => {
  const who = (x.match(PAIR) || [""])[0];
  return `<div class="step ${who ? "pair" : ""}"><span class="k">${i + 1}</span><div>${md(x)}${who ? `<span class="who">👥 ${who}</span>` : ""}</div></div>`;
}).join("");
const hint = (arr, open) => `<details class="hint"${open ? " open" : ""}><summary><span>💡 ヒントを見る<small>（${arr.length}こ）</small></span></summary><div class="fus">${arr.map((x) => `<div class="fu">${md(x)}</div>`).join("")}</div></details>`;
const H2 = (ic, t) => `<h2><span class="ic">${ic}</span>${t}</h2>`;

function home() {
  board("");
  setColor(0);
  const last = getLast();
  const L = D.lessons.find((x) => x.id === last);
  const group = (p) => `<div class="phase p${p}"><div class="ph">● ${PHASE_NAME[p]}</div><div class="lt">${D.lessons.filter((l) => phase(l.id) === p).map((l) =>
    `<a href="#/l/${l.id}" class="${l.id === last ? "last" : ""}"><span class="n">${esc(num(l))}</span>${esc(l["見出し"])}</a>`).join("")}</div></div>`;
  return `${L ? `<a class="back" href="#/l/${L.id}"><span>📍 前に見ていたページ：${esc(L["番号"])} ${esc(L["見出し"])}</span><span>→</span></a>` : ""}
  <h1>${esc(D.unit["題"])}</h1>
  <div class="goal"><span class="lbl">ゴール</span>${esc(D.unit["ゴール"])}</div>
  <p class="note">${md(D.unit["教材"])}</p>
  ${H2("📍", "今日は何時間目？")}
  ${[1, 2, 3].map(group).join("")}
  ${H2("🧰", "いつでも使えるページ")}
  <div class="tiles">
    <a href="#/komatta" class="help"><span class="e">🆘</span><span>困ったときのメニュー<small>聞かなくても使ってよいもの</small></span></a>
    <a href="#/dougu"><span class="e">🧰</span><span>ことばの道具箱<small>書き出し・話し方の型</small></span></a>
    <a href="#/kata"><span class="e">🧩</span><span>5つの構成の型<small>⑧⑨で使う</small></span></a>
    <a href="#/kimari"><span class="e">🚩</span><span>自由進度のきまり<small>関門・関所・メニュー</small></span></a>
  </div>`;
}

function lesson(id) {
  const l = D.lessons.find((x) => x.id === id);
  if (!l) return home();
  board(id);
  setColor(phase(id));
  setLast(id);
  let left = `<div class="meate"><span class="lbl">${esc(l["番号"])} きょうの めあて</span><div class="t">${esc(l["めあて"])}</div></div>
  ${l["めあての注"] ? `<p class="meate-note">${md(l["めあての注"])}</p>` : ""}
  ${H2("✓", "やること")}${steps(l["やること"])}`;
  if (l["メニュー"]) {
    left += `${H2("🍱", "今日のメニュー")}<div class="menu5">${l["メニュー"].map(([a, b]) =>
      `<div class="${a.includes("★") ? "must-box" : ""}"><b>${esc(a)}</b>${esc(b)}</div>`).join("")}</div>`;
  }
  if (l["話し方"]) {
    left += `${H2("💬", "グループで話すとき")}<div class="say">${l["話し方"].map((x) =>
      `<div class="${x.startsWith("（聞く人）") ? "ask" : ""}">${md(x)}</div>`).join("")}</div>`;
  }
  const links = [];
  if (["5-7", "8"].includes(id)) links.push(`<a href="#/kimari"><span class="e">🚩</span><span>自由進度のきまり<small>関門・関所</small></span></a>`);
  if (["8", "9"].includes(id)) links.push(`<a href="#/kata"><span class="e">🧩</span>5つの構成の型</a>`);
  links.push(`<a href="#/dougu"><span class="e">🧰</span>ことばの道具箱</a>`, `<a href="#/komatta" class="help"><span class="e">🆘</span>困ったときのメニュー</a>`);
  const right = `${H2("🎒", "使うもの")}<div class="mono">${l["紙"].map((p) => `<span>${esc(p)}</span>`).join("")}<span class="book">教科書</span></div>
  ${hint(l["ヒント"], window.innerWidth >= 1000)}
  ${H2("🔗", "こちらも見る")}<div class="tiles">${links.join("")}</div>`;
  const i = D.lessons.indexOf(l), pv = D.lessons[i - 1], nx = D.lessons[i + 1];
  const pn = `<div class="pn">${pv ? `<a href="#/l/${pv.id}"><small>← 前の時間</small>${esc(pv["番号"])} ${esc(pv["見出し"])}</a>` : "<span></span>"}${nx ? `<a class="nx" href="#/l/${nx.id}"><small>次の時間 →</small>${esc(nx["番号"])} ${esc(nx["見出し"])}</a>` : ""}</div>`;
  return `<div class="cols"><div class="left">${left}</div><div class="right">${right}</div></div>${pn}`;
}

/* こまりごとの絵（文の中の言葉で決める） */
const KICON = [[/本を読めば|本が/, "📚"], [/読め|読む/, "📖"], [/工夫が見つから/, "🔍"], [/工夫をえらべ/, "🤔"], [/題材/, "🎎"], [/二さつ目/, "📗"], [/図に/, "🗺️"], [/構成/, "🧩"], [/書き出せ/, "✏️"], [/早く終わ/, "🏁"]];
const kicon = (s) => (KICON.find(([r]) => r.test(s)) || [0, "❓"])[1];

function komatta() {
  board("");
  setColor(0);
  return `<h1>🆘 困ったときのメニュー</h1>
  <p>困ってからでなく、<b>初めから使ってよい</b>ものです。「使ってもいいですか」と聞かなくてかまいません。</p>
  <div class="kgrid">
    <div class="klist">${D.komatta.map((k, i) => `<button class="kb" data-k="${i}"><span class="e">${kicon(k["こまりごと"])}</span>${esc(k["こまりごと"])}</button>`).join("")}</div>
    <div class="kpanel" id="kpanel"><p class="empty">👈 困っていることをえらぶと、ここに「使えるもの」が出ます。</p></div>
  </div>`;
}
function showK(i) {
  const k = D.komatta[i];
  document.querySelectorAll("button.kb").forEach((b) => b.classList.toggle("on", b.dataset.k === String(i)));
  $("#kpanel").innerHTML = `<h3>${kicon(k["こまりごと"])} ${esc(k["こまりごと"])}</h3><ol>${k["使えるもの"].map((x) => `<li>${md(x)}</li>`).join("")}</ol>`;
  if (window.innerWidth < 900) {
    const y = $("#kpanel").getBoundingClientRect().top + window.scrollY - $("header.top").offsetHeight - 8;
    window.scrollTo({ top: y, behavior: "smooth" });
  }
}

function dougu() {
  board("");
  setColor(1);
  return `<h1>🧰 ことばの道具箱</h1>
  <p class="note">書くとき・話すときに、そのまま使ってよい言い方です。（　）の中の番号は、主に使う時間です。</p>
  <div class="jump">${D.dougu.map((d, i) => `<a href="#/dougu" data-j="d${i}">${esc(d["見出し"].split("（")[0].replace(" ―― ", "・"))}</a>`).join("")}</div>
  ${D.dougu.map((d, i) => {
    let body;
    if (d["形"] === "表") {
      body = `<table class="t">${d["中身"].map(([a, b]) => `<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join("")}</table>`;
    } else {
      const f = (x) => md(x).replace(/＿＿＿|＿＿/g, '<span class="blank"></span>');
      body = `<div class="say">${d["中身"].map((x) => `<div class="${x.startsWith("（聞く人）") ? "ask" : ""}">${f(x)}</div>`).join("")}</div>`;
    }
    return `<h2 id="d${i}"><span class="ic">✎</span><span>${esc(d["見出し"])} <span class="note">（${esc(d["時間"])}）</span></span></h2>${body}${d["注"] ? `<p class="note">※${esc(d["注"])}</p>` : ""}`;
  }).join("")}`;
}

function kata() {
  board("");
  setColor(2);
  const K = D.kata;
  const zuLbl = ["初め", "中", "終わり"];
  return `<h1>🧩 5つの構成の型</h1>
  <p class="note">型の文は、${esc(K["出典"])}から引用しています。図とひとことは、この手引きで足したものです。★がいちばん伝えたいことです。</p>
  ${K["グループ"].map((g) => `${H2("🧩", esc(g["名"]))}<div class="kata">${g["型"].map((k) => `
    <div class="card">
      <div><span class="no">${esc(k["番号"])}</span><div class="bun">${esc(k["文"])}</div><div class="muku">${esc(k["向く"])}</div></div>
      <div class="zu">${k["図"].map((z, i) => `<div class="${z.startsWith("★") ? "star" : ""}"><b>${zuLbl[i]}</b>${esc(z)}</div>`).join("")}</div>
    </div>`).join("")}</div>`).join("")}
  ${H2("✓", "型のえらび方")}${steps(K["えらび方"])}`;
}

function kimari() {
  board("");
  setColor(2);
  const J = D.jiyu;
  return `<h1>🚩 自由進度のきまり</h1>
  ${H2("🚩", "⑤〜⑦ 材料をそろえる ―― 3つの関門")}
  <p>順番はえらべますが、<span class="must">①②③は、通らずには終われません。</span></p>
  <div class="gates">${J["関門"].map(([a, b, c]) => `<div class="gate"><h3>🚩 ${esc(a)}</h3><div><b>${esc(b)}</b></div><p class="note">${md(c)}</p></div>`).join("")}</div>
  ${H2("✓", "⑤〜⑦ 進め方のきまり")}${list(J["きまり"])}
  ${H2("⛩️", "⑧ 構成をえらぶ ―― 関所のきまり")}${list(J["第8時のきまり"])}`;
}

function route() {
  const h = location.hash.replace(/^#\/?/, "");
  let html, page;
  if (h.startsWith("l/")) { html = lesson(h.slice(2)); page = "lesson"; }
  else if (h === "komatta") { html = komatta(); page = "komatta"; }
  else if (h === "dougu") { html = dougu(); page = "dougu"; }
  else if (h === "kata") { html = kata(); page = "kata"; }
  else if (h === "kimari") { html = kimari(); page = "kimari"; }
  else { html = home(); page = "home"; }
  $("#main").innerHTML = html;
  bottom(page);
  document.documentElement.style.setProperty("--hd", $("header.top").offsetHeight + "px");
  document.querySelectorAll("button.kb").forEach((b) => b.addEventListener("click", () => showK(Number(b.dataset.k))));
  // 道具箱の見出しへ飛ぶ（アドレスは変えない）
  document.querySelectorAll("[data-j]").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault(); const t = document.getElementById(a.dataset.j); if (t) t.scrollIntoView({ behavior: "smooth" });
  }));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => document.documentElement.style.setProperty("--hd", $("header.top").offsetHeight + "px"));
route();
</script>
</body>
</html>
