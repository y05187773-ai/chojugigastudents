<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>みりょく発見ナビ</title>
<style>
/* 案E「黒板型」（2026-11-16 決定。見本は 設計メモ/児童用サイト_レイアウト案/案E_黒板型.html）。
   左＝木のわく（行き先・タイマー・困ったとき）／上＝10時間の道のり／下＝チョーク置き（3色の見分け）。
   黒板の上はチョークの色。紙（ヒントのふせん・使うもの・構成メモの見本・タイマー）だけ白や黄色の地に黒い字。 */
:root {
  --board: #2b4a3f; --dark: #1b2f28; --chalk: #f5f4ea; --dim: #a9c0b5; --line: rgba(245,244,234,.3); --line2: rgba(245,244,234,.55);
  --c1: #a8d8ff; --c1s: rgba(168,216,255,.16);   /* 読んで見つける ①〜④（水色のチョーク） */
  --c2: #c6e89a; --c2s: rgba(198,232,154,.16);   /* 材料を集める ⑤〜⑧（黄緑のチョーク） */
  --c3: #ffc48a; --c3s: rgba(255,196,138,.16);   /* 書いて伝える ⑨⑩（うすいだいだいのチョーク） */
  --yel: #ffe57a; --help: #b3261e; --helpc: #ffa79f; --helps: rgba(255,167,159,.16); --paper: #fff2a8;
  --c: var(--c1); --cs: var(--c1s);   /* いまのページの色 */
  --rail: 92px; --hd: 58px; --tray: 28px;
  --kyo: "Klee", "クレー", "Klee One", "BIZ UDPGothic", "Hiragino Sans", sans-serif;
  --hand: 14px 5px 12px 6px / 6px 12px 5px 14px;   /* チョークでかいたような、少しゆがんだ角 */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body {
  margin: 0; color: var(--chalk);
  background: radial-gradient(ellipse at 22% 28%, rgba(255,255,255,.07), transparent 46%), radial-gradient(ellipse at 78% 74%, rgba(255,255,255,.05), transparent 52%), var(--board);
  background-attachment: fixed;
  font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  font-size: 19px; line-height: 1.7;
}
a { color: inherit; text-decoration: none; }
b { font-weight: 700; color: #fff; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--yel); outline-offset: 2px; }
.p1 { --pc: var(--c1); --ps: var(--c1s); } .p2 { --pc: var(--c2); --ps: var(--c2s); } .p3 { --pc: var(--c3); --ps: var(--c3s); }

/* ---------- 左：木のわく（行き先はいつもここ） ---------- */
nav.rail { position: fixed; left: 0; top: 0; bottom: 0; width: var(--rail); z-index: 6; display: flex; flex-direction: column;
  background: linear-gradient(90deg, #6a4625, #8b5f38 55%, #6a4625); padding-bottom: env(safe-area-inset-bottom); }
nav.rail a, nav.rail #tFab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 0;
  color: #f8ecd9; font-size: 13px; font-weight: 700; line-height: 1.25; text-align: center; border: 0; border-left: 6px solid transparent; background: none; padding: 2px; }
nav.rail svg { width: 28px; height: 28px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.rail a.on { background: var(--board); color: var(--chalk); border-left-color: var(--yel); }
nav.rail a.help { background: var(--help); color: #fff; flex: 1.15; }
nav.rail a.help.on { border-left-color: #fff; }
#tFab { font-variant-numeric: tabular-nums; }
#tFab.run { background: #3f7a52; color: #fff; }
#tFab.warn { background: #c96f1a; color: #fff; }
#tFab.end { background: var(--help); color: #fff; animation: tblink 1s steps(2) infinite; }
@keyframes tblink { 50% { opacity: .55; } }

/* ---------- 上：10時間の道のり ---------- */
nav.strip { position: fixed; left: var(--rail); right: 0; top: 0; height: var(--hd); z-index: 5; display: flex; background: var(--dark); border-bottom: 2px solid var(--line); }
nav.strip a { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 4px; font-size: 13px; line-height: 1.2; font-weight: 700;
  color: var(--chalk); border-bottom: 6px solid var(--pc); border-right: 1px solid var(--line); }
nav.strip a i { font-style: normal; flex: 0 0 auto; min-width: 28px; height: 28px; padding: 0 5px; border-radius: 14px; border: 2px solid var(--pc); color: var(--pc); display: flex; align-items: center; justify-content: center; font-size: 15px; }
nav.strip a.done { color: var(--dim); }
nav.strip a.now { flex: 1.6 1 0; background: var(--pc); color: var(--dark); font-size: 16px; white-space: nowrap; }
nav.strip a.now i { background: var(--dark); border-color: var(--dark); }
nav.strip a.now::after { content: "いまここ"; font-size: 11px; background: var(--dark); color: #fff; border-radius: 4px; padding: 0 6px; line-height: 1.7; margin-left: 2px; }

/* ---------- 下：チョーク置き（3本のチョークが色の見分け） ---------- */
.tray { position: fixed; left: var(--rail); right: 0; bottom: 0; height: var(--tray); z-index: 5; background: linear-gradient(#946a41, #6a4625);
  display: flex; align-items: center; gap: 22px; padding: 0 22px; font-size: 13px; font-weight: 700; color: #f8ecd9; }
.tray span { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tray span::before { content: ""; width: 38px; height: 10px; border-radius: 3px; background: var(--pc); box-shadow: 0 2px 0 rgba(0,0,0,.3); }

main { margin-left: var(--rail); padding: calc(var(--hd) + 20px) 22px 24px; max-width: calc(1180px + var(--rail)); }

/* ---------- 共通の部品 ---------- */
h1 { font: 700 25px/1.4 var(--kyo); margin: 4px 0 14px; }
h2 { font-size: 20px; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; line-height: 1.4; }
h2 .ic { flex: 0 0 auto; font-size: 20px; }
.note { color: var(--dim); font-size: 16px; margin: 6px 4px; }
.meate, .goal { position: relative; border: 3px solid var(--yel); border-radius: var(--hand); padding: 14px 18px 12px; margin-top: 12px; }
.meate .lbl, .goal .lbl { position: absolute; top: -14px; left: 14px; background: var(--yel); color: var(--dark); font-size: 14px; font-weight: 700; padding: 0 10px; border-radius: 4px; line-height: 1.7; }
.meate .t, .goal .t { font: 700 26px/1.5 var(--kyo); margin-top: 2px; }
.meate-note { color: var(--dim); font-size: 16px; margin: 6px 4px 0; }
.pg { display: inline-block; white-space: nowrap; background: var(--cs); color: var(--c); font-weight: 700; border-radius: 8px; padding: 0 7px; margin: 0 1px; }
.blank { display: inline-block; min-width: 4em; border-bottom: 2px solid currentColor; }
.must { color: var(--helpc); font-weight: 700; }

/* 紙（黒板にはったもの）：白・黄色の地に黒い字。中の色はこい色にもどす */
.paper, .mono span, .hint, .fnote, .memo-ex, .tbox {
  color: #1d1d1f; --c: #2b6a45; --cs: #e3f3ea; --c1: #2f6fb5; --c1s: #e6effa; --c2: #2e8b57; --c2s: #e3f3ea; --c3: #c96f1a; --c3s: #fdf0e1; --helpc: #b3261e; --helps: #fde8e6;
}
.paper b, .mono span b, .hint b, .fnote b, .memo-ex b, .tbox b { color: inherit; }
.mono { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
.mono span { background: var(--chalk); border-radius: 3px; padding: 1px 10px; font-size: 16px; font-weight: 700; box-shadow: 2px 3px 0 rgba(0,0,0,.25); }

/* やること：黒板にチョークで書いた番号と文 */
.steps { border-top: 2px solid var(--line); }
.step { display: flex; gap: 14px; align-items: flex-start; padding: 9px 10px 9px 6px; border-bottom: 2px dashed var(--line); }
.step .k { flex: 0 0 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--c); color: var(--c); font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; }
.step.pair .k { border-color: var(--c3); color: var(--c3); }
.step .who { display: inline-block; white-space: nowrap; font-size: 13px; font-weight: 700; color: var(--c3); border: 2px solid var(--c3); border-radius: 4px; padding: 0 6px; margin-left: 6px; line-height: 1.5; vertical-align: 1px; }

/* ヒント：黄色いふせん。2行だけ見せて、おすと全部読める */
.hints { display: flex; flex-direction: column; gap: 9px; }
.hint { display: block; width: 100%; text-align: left; background: var(--paper); border: 0; border-radius: 3px 3px 12px 3px; padding: 8px 12px; font-size: 17px; line-height: 1.6; box-shadow: 2px 3px 0 rgba(0,0,0,.25); }
.hint > span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hint.open > span { display: block; }

/* チョークの線でかこんだ、おせる所 */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.tiles a { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line2); border-radius: var(--hand); padding: 10px 14px; font-weight: 700; min-height: 64px; line-height: 1.4; }
.tiles a .e { font-size: 26px; }
.tiles a small { display: block; font-weight: 400; color: var(--dim); font-size: 14px; }
.tiles a.help { background: var(--help); border-color: var(--help); color: #fff; }
.tiles a.help small { color: #ffe1dd; }
.tiles a:active, nav.strip a:active, nav.rail a:active, button:active { transform: translateY(1px); }

.say { display: flex; flex-direction: column; gap: 8px; }
.say div { border: 2px solid var(--line2); border-radius: 16px 16px 16px 4px; padding: 8px 16px; font-size: 20px; }
.say div.ask { border-color: var(--c3); background: var(--c3s); border-radius: 16px 16px 4px 16px; margin-left: 2em; }

.menu5 { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.menu5 div { border: 2px solid var(--line2); border-radius: var(--hand); padding: 8px 14px; line-height: 1.5; }
.menu5 div b { display: block; font-size: 20px; color: var(--c); }
.menu5 div.must-box { border: 3px solid var(--helpc); background: var(--helps); }
.menu5 div.must-box b { color: var(--helpc); }

.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
.pn a { display: block; border: 2px solid var(--line2); border-radius: var(--hand); padding: 10px 16px; min-height: 64px; font-weight: 700; }
.pn a small { display: block; font-weight: 400; color: var(--dim); font-size: 14px; }
.pn a.nx { text-align: right; border-color: var(--c); }

/* 時間のページ：横向きは2列（左＝めあて・やること／右＝使うもの・ヒント・ほかのページ） */
.cols { display: grid; grid-template-columns: 1fr; gap: 0 22px; }
@media (min-width: 901px) {
  .cols { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); align-items: start; }
  .cols .right { position: sticky; top: calc(var(--hd) + 16px); max-height: calc(100vh - var(--hd) - var(--tray) - 32px); overflow-y: auto; padding: 0 4px 8px 0; }
  .cols .right h2:first-child { margin-top: 12px; }
}

/* ホーム */
.resume { display: flex; align-items: center; gap: 18px; background: var(--c); color: var(--dark); border-radius: 6px; padding: 14px 22px; margin-bottom: 26px; }
.resume i { font-style: normal; flex: 0 0 64px; height: 64px; border-radius: 50%; background: var(--dark); color: var(--c); font-weight: 700; font-size: 26px; display: flex; align-items: center; justify-content: center; }
.resume small { display: block; font-size: 15px; line-height: 1.4; font-weight: 700; }
.resume b { font: 700 28px/1.4 var(--kyo); color: inherit; }
.resume em { margin-left: auto; font-style: normal; font-weight: 700; background: var(--dark); color: #fff; border-radius: 4px; padding: 6px 18px; white-space: nowrap; }
.road { display: grid; grid-template-columns: 4fr 2fr 2fr; border: 2px solid var(--line); border-radius: var(--hand); }
.road > div { padding: 10px 14px 12px; border-right: 2px solid var(--line); }
.road > div:last-child { border-right: 0; }
.road h3 { margin: 0 0 4px; font-size: 18px; color: var(--pc); border-bottom: 5px solid var(--pc); padding-bottom: 4px; }
.road .ls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 14px; }
.road a { display: flex; align-items: center; gap: 10px; min-height: 64px; font-size: 21px; font-weight: 700; border-bottom: 2px dashed var(--line); }
.road a i { font-style: normal; min-width: 36px; height: 36px; padding: 0 5px; border-radius: 18px; border: 2px solid var(--pc); color: var(--pc); display: flex; align-items: center; justify-content: center; font-size: 17px; }
.road a.done { color: var(--dim); }
.road a.now i { background: var(--pc); color: var(--dark); }

/* 困ったとき：左にこまりごと、右に使えるもの */
.kgrid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 901px) { .kgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: start; } .kpanel { position: sticky; top: calc(var(--hd) + 16px); } }
.klist { display: flex; flex-direction: column; gap: 8px; }
button.kb { text-align: left; display: flex; align-items: center; gap: 12px; background: none; border: 2px solid var(--line2); border-radius: var(--hand); padding: 8px 14px; min-height: 60px; font-weight: 700; font-size: 18px; color: var(--chalk); line-height: 1.4; }
button.kb .e { font-size: 24px; flex: 0 0 auto; }
button.kb.on { border: 3px solid var(--helpc); background: var(--helps); }
.kpanel { border: 3px solid var(--helpc); border-radius: var(--hand); padding: 14px 18px; min-height: 200px; }
.kpanel h3 { margin: 0 0 8px; color: var(--helpc); font-size: 21px; line-height: 1.4; }
.kpanel ol { margin: 0; padding-left: 1.4em; }
.kpanel li { margin-bottom: 8px; }
.kpanel .empty { color: var(--dim); }

/* 道具箱・型・きまり */
.jump { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 8px; position: sticky; top: var(--hd); background: var(--board); z-index: 4; }
.jump a { flex: 0 0 auto; border: 2px solid var(--line2); border-radius: 999px; padding: 6px 14px; font-size: 15px; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
h2[id] { scroll-margin-top: calc(var(--hd) + 64px); }
table.t { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
table.t th, table.t td { padding: 8px 14px; text-align: left; vertical-align: top; border: 2px solid var(--line); }
table.t th { width: 8em; background: var(--cs); color: var(--c); white-space: nowrap; border-radius: 10px 0 0 10px; border-right: 0; }
table.t td { border-radius: 0 10px 10px 0; border-left: 0; }
.kata { display: grid; grid-template-columns: 1fr; gap: 10px; }
.kata .card { border: 2px solid var(--line2); border-radius: var(--hand); padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: center; }
.kata .no { display: inline-block; font-weight: 700; color: var(--dark); background: var(--c); border-radius: 999px; padding: 0 12px; font-size: 16px; }
.kata .bun { font-size: 20px; font-weight: 700; margin-top: 4px; }
.kata .muku { color: var(--dim); font-size: 16px; margin-top: 4px; }
.zu { display: flex; flex-direction: column; gap: 4px; }
.zu div { border: 2px solid var(--line); border-radius: 10px; padding: 3px 10px; font-size: 16px; display: flex; gap: 8px; }
.zu div b { color: var(--dim); font-weight: 400; min-width: 3em; }
.zu div.star { border-color: var(--c3); background: var(--c3s); font-weight: 700; }
.gates { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.gate { border: 3px solid var(--c2); border-radius: var(--hand); padding: 0 0 10px; overflow: hidden; }
.gate h3 { margin: 0 0 6px; background: var(--c2); color: var(--dark); padding: 4px 14px; font-size: 19px; }
.gate div { padding: 0 14px; }
.gate .note { margin: 4px 14px 0; padding: 0; }
ul.list { list-style: none; padding: 0; margin: 0; border-top: 2px solid var(--line); }
ul.list li { padding: 8px 14px 8px 40px; border-bottom: 2px dashed var(--line); position: relative; }
ul.list li::before { content: "▶"; position: absolute; left: 14px; color: var(--c); font-size: 14px; top: 11px; }

footer { margin-left: var(--rail); padding: 0 22px calc(var(--tray) + 24px); color: var(--dim); font-size: 13px; }

/* ---------- たて向き：行き先は下へ、列は1つに。チョーク置きは出さない ---------- */
@media (max-width: 900px) {
  :root { --rail: 0px; --tray: 0px; }
  .tray { display: none; }
  nav.rail { top: auto; right: 0; width: auto; height: 68px; flex-direction: row; background: linear-gradient(#946a41, #6a4625); box-sizing: content-box; }
  nav.rail a, nav.rail #tFab { border-left: 0; border-top: 6px solid transparent; font-size: 11px; }
  nav.rail a.on { border-top-color: var(--yel); }
  nav.rail svg { width: 24px; height: 24px; }
  nav.strip a:not(.now) { font-size: 0; gap: 0; }
  .road { grid-template-columns: 1fr; }
  .road > div { border-right: 0; border-bottom: 2px solid var(--line); }
  .road > div:last-child { border-bottom: 0; }
  footer { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
  .meate .t, .goal .t { font-size: 22px; }
}
@media (max-width: 700px) {
  body { font-size: 17px; }
  h1 { font-size: 22px; }
  .kata .card { grid-template-columns: 1fr; }
  table.t th { width: auto; white-space: normal; }
  .resume { flex-wrap: wrap; } .resume em { margin-left: 0; }
}

/* ---------- 構成メモの書き方（紙の見本） ---------- */
.memo-ex { background: var(--chalk); border-radius: 4px; padding: 10px 14px; box-shadow: 2px 3px 0 rgba(0,0,0,.25); }
.memo-ex .mh { font-size: 16px; color: #555; margin-bottom: 6px; }
.memo-ex .mh b { color: #1d1d1f; }
.memo-ex .note { color: #555; }
.memo-ex .kata-in { display: inline-block; border: 2px solid var(--c); color: var(--c); border-radius: 8px; padding: 0 8px; font-weight: 700; margin-left: 4px; }
.mrow { display: grid; grid-template-columns: 4.2em 1fr 3.2em; gap: 6px; margin-bottom: 6px; }
.mrow > div { border: 2px solid #bbb; border-radius: 8px; padding: 6px 10px; font-size: 17px; line-height: 1.5; background: #fff; }
.mrow .lb { text-align: center; font-weight: 700; background: #f2f2f2; display: flex; align-items: center; justify-content: center; }
.mrow .kk { text-align: center; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.mrow.star > div { border-color: var(--c); }
.mrow.star .kk, .mrow .kk.k { color: var(--helpc); }
.mrow .st { color: var(--helpc); font-weight: 700; margin-right: 4px; }
table.starpos { border-collapse: separate; border-spacing: 0 6px; }
table.starpos th { background: var(--cs); color: var(--c); padding: 6px 12px; border-radius: 10px 0 0 10px; white-space: nowrap; border: 2px solid var(--line); border-right: 0; }
table.starpos td { padding: 6px 12px; border-radius: 0 10px 10px 0; border: 2px solid var(--line); border-left: 0; }
.memo-cta { display: inline-block; margin-top: 10px; font-weight: 700; color: var(--c); }
/* ---------- ふせんの書き方 ---------- */
.fkata { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.fkata .card { border: 2px solid var(--line2); border-radius: var(--hand); padding: 10px 14px 12px; }
.fkata .card h3 { margin: 0 0 4px; font-size: 18px; color: var(--c); }
.fkata .kt { font-size: 18px; line-height: 1.6; }
.fkata .kt .blank, .fmini .blank { display: inline-block; min-width: 3.2em; border-bottom: 2px solid currentColor; }
.fnote { background: var(--paper); border-radius: 3px 3px 12px 3px; padding: 8px 12px; margin-top: 8px; font-size: 17px; line-height: 1.6; box-shadow: 2px 3px 0 rgba(0,0,0,.25); transform: rotate(-.6deg); }
.fnote::before { content: "ふせんの例"; display: block; font-size: 12px; color: #666; font-weight: 700; }
table.fbad { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
table.fbad td { padding: 8px 12px; font-size: 17px; vertical-align: middle; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); }
table.fbad td.x { color: var(--dim); width: 30%; border-radius: 10px 0 0 10px; border-left: 2px solid var(--line); }
table.fbad td.ar2 { width: 2em; text-align: center; font-weight: 700; color: var(--c); }
table.fbad td.o { border-radius: 0 10px 10px 0; border-right: 2px solid var(--line); font-weight: 700; }
.fmini { border: 2px solid var(--line2); border-radius: var(--hand); padding: 10px 16px; }
.fmini div { padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 17px; }
.fmini div:last-child { border-bottom: 0; }
.fmini a.more { display: inline-block; margin-top: 8px; font-weight: 700; color: var(--c); }
@media (max-width: 700px) { table.fbad td.x { width: auto; } }

/* ---------- タイマー（左の「タイマー」から開く。中は白い紙） ---------- */

<script>
const D = {"unit": {"題": "筆者の工夫をとらえて読み、それをいかして書こう", "教材": "「『鳥獣戯画』を読む」「発見、日本文化のみりょく」（教科書 155〜169ページ）", "ゴール": "自分がえらんだ日本文化のよさを、おうちの人や地域の人に伝える文章を書いて、読み合う。（授業参観で、ろう下にはり出します）"}, "lessons": [{"id": "1", "番号": "①", "見出し": "見通しをもつ", "紙": ["WS01", "ロードマップ"], "めあて": "学習のゴールをたしかめ、ゴールまでの見通しをもとう。", "やること": ["155ページの絵を見て、気づいたことを、**絵のどこか**と合わせて書く。", "ペアで、気づいたことを話す。自分では気づかなかったことを書き足す。", "「『鳥獣戯画』を読む」を読む。読み上げの音声を聞きながらでもよい。", "155ページの上の文を読んで、**単元のゴール**を書き入れる。読んでもらう相手は、**おうちの人や地域の人**。", "ロードマップを見て、WS01の３の問いに答える。", "いちばんがんばりたい時間と、そのわけを、ペアで伝え合う。"], "ヒント": ["３の問いの答えは、**ロードマップの中に書いてあります。** ロードマップをよく見ましょう。", "「読んでもらう相手」は、先生の話を聞いて書きましょう。"]}, {"id": "2", "番号": "②", "見出し": "絵と文章", "紙": ["WS02", "ロイロで配る絵"], "めあて": "絵と文章を照らし合わせて、筆者が絵のどこを取り上げているかをたしかめよう。", "やること": ["156〜162ページを音読する。", "WS02の三つの文（ア 156ページ／イ 158ページ11〜12行目／ウ 159ページ4行目）が、絵のどこのことかを、ロイロの絵にア・イ・ウで書きこむ。", "ペアで「この文は、絵のどこ？」と、**指でさして**たしかめ合う。", "160ページ1〜2行目を読んで、ロイロの絵に、時間が流れる向きを矢印で書く。", "157ページ13行目のとおりに、ページをめくってみる。", "158ページ7〜8行目を読んで、筆者がなぜ絵をわざと切りはなして見せたのかを考える。"], "ヒント": ["場所は「**だれの、どこ**」で書きます。「だれの」はどの動物か、「どこ」は体のどの部分かです。", "考えるときの書き出し：「切りはなしてあると、読む人は……」", "全部の文でなくてよい。先生が「ここ」と言った文から始めましょう。"]}, {"id": "3", "番号": "③", "見出し": "工夫を見つける", "紙": ["WS03", "ふせん"], "めあて": "筆者が『鳥獣戯画』をどう評価しているかを見つけ、それを伝えるための工夫を書き出そう。", "やること": ["164ページ上段を読んで、筆者が「**絵**」と「**絵巻物**」の二つについて、自分の評価を書いていることをたしかめる。", "筆者がすごいと思っていることが分かる言葉をさがして、線を引く。〈絵〉は156〜159ページ、〈絵巻物〉は161〜162ページ。", "筆者の工夫を、**三つの見方**でさがして書く。例は164ページ下段にあります。", "グループで出し合って、三つの見方のどれに当たるかを分ける。", "いちばん「なるほど」と思った工夫に◎をつける。"], "ヒント": ["三つの見方は「ことばの道具箱」にもあります。", "表現の工夫で見るところ：文の終わり方／話しかけ・問いかけ／短く言い切る文／様子を表す言葉。", "ふつうの説明文なら「〜である。」と書くところを、筆者はどう書いているでしょう。", "ふせんは**1まいに1つ**。1つ書けたら、次に進んでよい。", "どこをさがせばよいか分からないときは、さがす所を**1ページにしぼって**かまいません。"]}, {"id": "4", "番号": "④", "見出し": "工夫をえらぶ", "紙": ["WS04", "おすすめカード", "「読む人が〜」の型"], "めあて": "自分が書くときに使いたい筆者の工夫をえらび、なぜ効果的なのかを本文の言葉で説明しよう。", "やること": ["学級の工夫マップを見て、自分が書き出していなかった工夫を一つ書く。", "使いたい工夫を一つえらぶ。", "その工夫が分かる教科書の言葉を、**ページと行**といっしょに書く。", "その工夫で、読む人にどんなことがおこるかを書く。", "写真をとって提出箱へ出す。", "グループで1人1分半ずつ話す。左どなりの人が、かならずたずねる。", "話したあとで、変えたところを**赤ペン**で書く。"], "ヒント": ["えらべないときは、机の上の「**おすすめカード**」からえらんでよい。", "読み返すのは、前の時間にふせんをはった1〜2か所だけでよい。", "わけは「**読む人が、〜**」で書き始めましょう。（ことばの道具箱）", "書くのは短くてかまいません。"], "話し方": ["わたしがえらんだ工夫は、〜です。", "教科書 ○ページ ○行目の「　　」という言葉から、そう思いました。", "この工夫で、読む人が〜と思います。", "（聞く人）それは本文のどこから言えるの？"]}, {"id": "5-7", "番号": "⑤〜⑦", "見出し": "材料をそろえる", "紙": ["学習の手引き", "WS05", "WS06", "WS07"], "めあて": "自分の計画で学習を進め、いちばん伝えたいみりょくと、その材料をそろえよう。", "めあての注": "この3時間は、毎時間の「じぶんのめあて」を自分で書きます。", "やること": ["始める前に、今日どこまで進めるかをロードマップで決める。", "**Ａ 本を読む**（WS05）……日本文化の本を読み、初めて知ったことと、説明のしかたで「うまい」と思ったところを書く。", "**Ｂ 題材を決める**（WS06）……書く日本文化と、いちばん伝えたいみりょくを決める。168〜169ページの高橋さんの文章も読んで、できあがりの形を見ておく。", "**Ｃ 情報を集めて、整理する**（WS07）……カード1まいに、ことがら1つと、本の名前・ページを書く。集まったら311ページを見て、図に整理する。", "Ａ・Ｂ・Ｃの順番は自分で決める。ただし、**関門①②③は全員が通る。**"], "ヒント": ["関門と進め方のきまりは「**自由進度のきまり**」のページにあります。", "困ったら「**困ったときのメニュー**」を見ましょう。聞かなくても使ってよいものばかりです。", "第6時の終わりに、ペアで「いちばん伝えたいみりょく」を言い合います。それまでに関門②を通りましょう。", "第7時の終わりの15分は、全員で**5つの型**をたしかめ、自分の型を**仮にえらびます**（WS07の６）。グループで言い合います。型をえらんだら、**構成メモ**を立てます（書き方は、このページの下）。", "どこに書いてあったか言えないことは、書きません。"]}, {"id": "8", "番号": "⑧", "見出し": "構成をえらぶ", "紙": ["立てた構成メモ（型あり／自由）", "WS07の2まい目", "ふせん4まい", "赤ペン"], "めあて": "いちばん伝えたいことが伝わる構成をえらび、なぜその構成にしたのかを説明しよう。", "やること": ["立てた構成メモを机に出す。めあてと、今日の流れをたしかめる。", "**㋐ たしかめ** 黒板とロイロにある**高橋さんの文章の見本**（5つの型で書きかえたもの）を読みくらべる。まず**自分の型**、次に**もう一つ**。", "**㋑ 組み立てる** 構成メモを仕上げる。「か」「く」と★をつける。とちゅうの人は、ここから始める。", "**提出** 構成メモの写真を、ロイロの**自分がえらんだ型の提出箱**に出す。とちゅうでも出す。", "**㋒ 説明の関所** グループで、1人2分半で説明する。聞く人は提出箱で構成メモを見ながら聞き、問い返して、**ふせんに助言を書いてわたす**。", "**㋓ 書きかえる** 一人で、もらったふせんや聞いたことをもとに、赤ペンで**かならず一か所は直す**。「３ 直したところ」に書く。", "最後に、何人かが「どこを、なぜ直したか」を発表する。"], "メニュー": [["㋐ たしかめ", "見本を読みくらべて、自分の型をたしかめる"], ["㋑ 組み立てる", "構成メモを仕上げる（★・か・く）"], ["📤 提出", "自分がえらんだ型の提出箱に出す"], ["㋒ 説明の関所", "グループで説明し、ふせんで助言し合う"], ["㋓ 書きかえる", "一人で、ふせんを見て、かならず一か所直す"]], "ヒント": ["見本は5まい全部読まなくてよい。**自分の型と、もう一つ**。「変わるのは順番だけ？　伝わり方も変わる？」と考えながら読む。", "型が合わないと思ったら、えらび直してかまいません。「えらんだ型」に**赤ペン**で印をつけ直します。", "構成メモは、文でなく**短い言葉**でかまいません。", "関所で話す言い方は「ことばの道具箱」にあります。", "ふせんには、構成メモの**どこを、どう直すとよいか**を書きます。書き方の型は、このページの下と「**ふせんの書き方**」のページにあります。", "もらったふせんは、構成メモの空いている所にはっておきましょう。赤ペンは㋓で使います。", "㋓は一人で考える時間です。ふせんを「すぐ直せる」「考えたい」に分けて、「すぐ直せる」から一まいえらぶと決めやすい。", "㋒の時間は、画面の右下の「⏱ タイマー」で計れます。"]}, {"id": "9", "番号": "⑨", "見出し": "文章を書く", "紙": ["原こう用紙", "第4時の工夫カード", "第8時の構成メモ", "書き出しの用紙"], "めあて": "筆者の工夫を使って、えらんだ日本文化のよさが伝わる文章を書こう。", "やること": ["第4時の工夫カードと、第8時の構成メモを、机の上にならべる。", "168ページの高橋さんの文章をもう一度読んで、どんな工夫をしているかを見つける。", "第4時にえらんだ工夫を、文章の**どこで使うか**決める。", "構成メモをもとに、文章を書く。", "とちゅうで手を止めて、**書き出しだけ**をグループで読み合う。", "書き終わったら、ロイロで出す。"], "ヒント": ["書き出しに迷ったら「**書き出しの用紙**」を使ってよい。三つの形からえらべます。", "全部を一度に書かなくてよい。構成メモの**一つのらん**から書き始めましょう。", "「よさを伝えるときの言葉」は「ことばの道具箱」にあります。", "字を書くのがつらいときは、ロイロで打ってもよいか、先生に聞きましょう。"]}, {"id": "10", "番号": "⑩", "見出し": "読み合う", "紙": ["感想の型", "ロードマップ", "これまでの紙"], "めあて": "友達の文章のよいところを見つけて伝え、単元の学びをふりかえろう。", "やること": ["グループで文章を読み合う。", "よいところを「**どこが**」「**なぜ**」の二つで伝える。使っている筆者の工夫も見つける。", "169ページを見て、単元で学んだことをたしかめる。", "第4時の工夫カードと、できあがった文章をならべて、単元のふりかえりを書く。"], "ヒント": ["「よかったです」で終わりにしません。", "工夫は、教室の前にはってある三つの見方の言葉を使います。", "三つとも書けなくてよい。「どこが」と「なぜ」が書けていれば十分です。"]}], "jiyu": {"関門": [["関門①", "本から、使えそうな説明の工夫を一つ書けた", "WS05 の４が書けている。「どの本の、どこ？」に答えられる。"], ["関門②", "題材と、いちばん伝えたいみりょくが、一言で言える", "WS06 の１・２。書けていても、口で言えなければ通れません。**第6時までに。**"], ["関門③", "同じことがらを二さつでたしかめ、出典を書いた", "WS07 の４。本の名前とページが書いてある。"]], "きまり": ["順番は自分で決めます。", "始める前に、今日どこまで進めるかをロードマップで決めます。", "教室で進めても、図書館へ行ってもかまいません。", "関門の印は、先生がおします。", "どこに書いてあったか言えないことは、書きません。", "二さつの本でちがっていたら、どちらが**いつ・だれが**書いたものかを見て決めます。たしかめられないことは、書きません。"], "第8時のきまり": ["今日は、㋐ → ㋑ → 提出 → ㋒ → ㋓ の**順番で**、みんなで進む。", "㋒の前に、構成メモを**自分がえらんだ型の提出箱**に出す。とちゅうでも出す。", "**㋒ 説明の関所は、きめてあるグループ（5人）で行う。** 説明する順番も、先に決めておく。", "説明は1人2分半。先生の合図で、次の人に代わる。", "聞く人は、提出箱で説明する人の構成メモを開いて見ながら聞く。", "聞く人は、かならず一つは問い返し、**ふせんに助言を書いて**わたす。", "聞いてくれた人に、構成メモの「２ 説明の関所」の□にしるしをつけてもらう。", "㋓では、ふせんや聞いたことをもとに、**かならず一か所は直す**。"]}, "komatta": [{"こまりごと": "教科書の文が読めない・読むのがつらい", "使えるもの": ["**読み上げの音声**を聞いてよい。先生がロイロで配った音声を開きます。", "全部読まなくてよい。今日使う**ページと行**だけを読みましょう（その時間のページに書いてあります）。", "高橋さんの文章は、教室に** const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* **〜** は太字、[[〜]] は小さな注記、「156ページ」「158ページ11〜12行目」などは色のついた札にする */
const PG = /(\d+(?:〜\d+)?ページ(?:\s?\d+(?:〜\d+)?行目|上段|下段)?)/g;
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[\[(.+?)\]\]/g, '<span class="note">$1</span>').replace(PG, '<span class="pg">$1</span>');

};

/* ふせんに書く助言の型（第8時 ㋒）。テレビに映すときは #/fusen を開く */
const blank = (x) => md(x).replace(/＿＿＿|＿＿/g, '<span class="blank"></span>');
function fusen() {
  board("8");
  setColor(2);

}
const fusenMini = () => `${H2("📝", "ふせんの書き方")}<div class="fmini">${D.fusen["型"].slice(0, 3).map((k) => `<div>${blank(k["型"])}</div>`).join("")}

function lesson(id) {
  const l = D.lessons.find((x) => x.id === id);
  if (!l) return home();
  board(id);
  setColor(phase(id));
  setLast(id);
  let left = `<div class="meate"><span class="lbl">${esc(l["番号"])} 今日のめあて</span><div class="t">${esc(l["めあて"])}</div></div>
  ${l["めあての注"] ? `<p class="meate-note">${md(l["めあての注"])}</p>` : ""}
  ${H2("✓", "やること")}${steps(l["やること"])}`;
  if (l["メニュー"]) {
    left += `${H2("🍱", "今日のメニュー")}<div class="menu5">${l["メニュー"].map(([a, b]) =>
      `<div class="${a.includes("★") ? "must-box" : ""}"><b>${esc(a)}</b>${esc(b)}</div>`).join("")}</div>`;
  }
  if (id === "5-7") left += memoMini();
  if (id === "8") left += fusenMini();
  if (l["話し方"]) {
    left += `${H2("💬", "グループで話すとき")}<div class="say">${l["話し方"].map((x) =>
      `<div class="${x.startsWith("（聞く人）") ? "ask" : ""}">${md(x)}</div>`).join("")}</div>`;
  }
  const links = [];
  if (["5-7", "8"].includes(id)) links.push(`<a href="#/kimari"><span class="e">🚩</span><span>自由進度のきまり<small>関門・関所</small></span></a>`);
  if (["8", "9"].includes(id)) links.push(`<a href="#/kata"><span class="e">🧩</span>5つの構成の型</a>`);
  if (["5-7", "8"].includes(id)) links.push(`<a href="#/memo"><span class="e">🗒️</span>構成メモの書き方</a>`);
  if (id === "8") links.push(`<a href="#/fusen"><span class="e">📝</span>ふせんの書き方</a>`);
  links.push(`<a href="#/dougu"><span class="e">🧰</span>ことばの道具箱</a>`, `<a href="#/komatta" class="help"><span class="e">🆘</span>困ったときのメニュー</a>`);
  const right = `${H2("🎒", "使うもの")}<div class="mono">${l["紙"].map((p) => `<span>${esc(p)}</span>`).join("")}<span class="book">教科書</span></div>
  ${hint(l["ヒント"])}
  ${H2("🔗", "こちらも見る")}<div class="tiles">${links.join("")}</div>`;
  const i = D.lessons.indexOf(l), pv = D.lessons[i - 1], nx = D.lessons[i + 1];
  const pn = `<div class="pn">${pv ? `<a href="#/l/${pv.id}"><small>← 前の時間</small>${esc(pv["番号"])} ${esc(pv["見出し"])}</a>` : "<span></span>"}${nx ? `<a class="nx" href="#/l/${nx.id}"><small>次の時間 →</small>${esc(nx["番号"])} ${esc(nx["見出し"])}</a>` : ""}</div>`;
  return `<div class="cols"><div class="left">${left}</div><div class="right">${right}</div></div>${pn}`;
}

/* こまりごとの絵（文の中の言葉で決める） */
const KICON = [[/本を読めば|本が/, "📚"], [/読め|読む/, "📖"], [/工夫が見つから/, "🔍"], [/工夫をえらべ/, "🤔"], [/題材/, "🎎"], [/二さつ目/, "📗"], [/図に/, "🗺️"], [/構成/, "🧩"], [/書き出せ/, "✏️"], [/早く終わ/, "🏁"]];
const kicon = (s) => (KICON.find(([r]) => r.test(s)) || [0, "❓"])[1];

function komatta() {
  board("");
  setColor(0);
  return `<h1>🆘 困ったときのメニュー</h1>
  <p>困ってからでなく、<b>初めから使ってよい</b>ものです。「使ってもいいですか」と聞かなくてかまいません。</p>

function showK(i) {
  const k = D.komatta[i];

  if (window.innerWidth < 900) {
    const y = $("#kpanel").getBoundingClientRect().top + window.scrollY - $("#board").offsetHeight - 8;
    window.scrollTo({ top: y, behavior: "smooth" });

}

function dougu() {
  board("");
  setColor(1);
  return `<h1>🧰 ことばの道具箱</h1>
  <p class="note">書くとき・話すときに、そのまま使ってよい言い方です。（　）の中の番号は、主に使う時間です。</p>

  ${K["グループ"].map((g) => `${H2("🧩", esc(g["名"]))}<div class="kata">${g["型"].map((k) => `
    <div class="card">
      <div><span class="no">${esc(k["番号"])}</span><div class="bun">${esc(k["文"])}</div><div class="muku">${esc(k["向く"])}</div></div>
      <div class="zu">${k["図"].map((z, i) => `<div class="${z.startsWith("★") ? "star" : ""}"><b>${zuLbl[i]}</b>${esc(z)}</div>`).join("")}</div>

function kimari() {
  board("");
  setColor(2);
  const J = D.jiyu;
  return `<h1>🚩 自由進度のきまり</h1>
  ${H2("🚩", "⑤〜⑦ 材料をそろえる ―― 3つの関門")}
  <p>順番はえらべますが、<span class="must">①②③は、通らずには終われません。</span></p>
  <div class="gates">${J["関門"].map(([a, b, c]) => `<div class="gate"><h3>🚩 ${esc(a)}</h3><div><b>${esc(b)}</b></div><p class="note">${md(c)}</p></div>`).join("")}</div>
  ${H2("✓", "⑤〜⑦ 進め方のきまり")}${list(J["きまり"])}

/* ---------- タイマー（2026-11-16 追加） ----------
   どのページからでも右下のボタンで開く。ページを移っても止まらない。
   終わった時刻で計るので、画面を閉じていてもずれない。この iPad の中だけで覚えておく。 */
const TK = "miryoku-navi-timer";
const PRE = [[60, "1分"], [120, "2分"], [150, "2分半"], [180, "3分"], [300, "5分"], [480, "8分"], [600, "10分"]];
const T = { dur: 150, left: 150, run: false, end: 0, n: 1, i: 1, done: false };
try { Object.assign(T, JSON.parse(localStorage.getItem(TK) || "{}")); } catch (e) {}
const tSave = () => { try { localStorage.setItem(TK, JSON.stringify(T)); } catch (e) {} };
const tFmt = (x) => { x = Math.max(0, Math.ceil(x)); return `${Math.floor(x / 60)}:${String(x % 60).padStart(2, "0")}`; };
const tLeft = () => (T.run ? (T.end - Date.now()) / 1000 : T.left);
let actx = null;
function tSound(times) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    for (let k = 0; k < times; k++) {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + k * 0.4;
      o.type = "sine"; o.frequency.value = k === times - 1 ? 1047 : 880;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      o.start(t0); o.stop(t0 + 0.35);
    }
  } catch (e) {}
  if (times) try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch (e) {}
}
let msgTimer = 0;
function tMsg(t) { const m = $("#tMsg"); m.textContent = t; m.hidden = false; clearTimeout(msgTimer); msgTimer = setTimeout(() => { m.hidden = true; }, 3500); }
function tDraw() {
  const l = tLeft(), st = T.done ? "end" : l <= 10 && (T.run || l < T.dur) ? "end" : l <= 30 && (T.run || l < T.dur) ? "warn" : "";
  const fab = $("#tFab");
  if (!fab) return;
  fab.className = T.done ? "end" : T.run ? (st || "run") : "";
  $("#tFabT").textContent = T.done ? "時間です" : T.run || T.left < T.dur ? `${T.n > 1 ? T.i + "人目 " : ""}${tFmt(l)}` : "タイマー";
  if ($("#tOv").hidden) return;
  $("#tDisp").textContent = T.done ? "0:00" : tFmt(l);
  $("#tDisp").className = `tdisp ${st}`;
  $("#tBar").className = `tbar ${st}`;
  $("#tBar i").style.width = `${Math.max(0, Math.min(100, (l / T.dur) * 100))}%`;
  $("#tRound").textContent = T.done ? "時間です" : T.n > 1 ? `${T.i}人目 ／ ${T.n}人` : "";
  $("#tRound").className = `tround ${T.done ? "end" : ""}`;
  const go = $("#tGo");
  go.textContent = T.run ? "とめる" : T.done ? "もう一度" : T.left < T.dur ? "つづける" : "はじめる";
  go.classList.toggle("stop", T.run);
  $("#tPre").innerHTML = PRE.map(([v, t]) => `<button type="button" data-pre="${v}" class="${T.dur === v ? "on" : ""}">${t}</button>`).join("");
  $("#tN").innerHTML = [1, 2, 3, 4, 5, 6].map((v) => `<button type="button" data-n="${v}" class="${T.n === v ? "on" : ""}">${v === 1 ? "くり返さない" : v + "人"}</button>`).join("");
}
function tTick() {
  if (T.run) {
    let l = tLeft();
    while (T.run && l <= 0) {
      if (T.i < T.n) { T.i++; T.end += T.dur * 1000; l = tLeft(); if (l > 0) { tSound(2); tMsg(`次の人に代わります（${T.i}人目）`); } }
      else { T.run = false; T.left = 0; T.done = true; tSound(3); tMsg("時間です"); }
    }
    tSave();
  }
  tDraw();
}
function tStart() {
  tSound(0); /* 音を鳴らせるようにしておく（iPad は、さわったときでないと音の用意ができない） */
  if (T.done) { T.left = T.dur; T.i = 1; T.done = false; }
  T.end = Date.now() + T.left * 1000; T.run = true; tSave(); tDraw();
}
function tStop() { T.left = Math.max(0, tLeft()); T.run = false; tSave(); tDraw(); }
function tReset() { T.run = false; T.left = T.dur; T.i = 1; T.done = false; tSave(); tDraw(); }
function tSetDur(v) { T.dur = Math.max(30, Math.min(3600, v)); tReset(); }
let armT = 0;
function tOpen() { $("#tOv").hidden = false; tDraw(); }
function tClose() { $("#tOv").hidden = true; $("#tBox").classList.remove("big"); $("#tBig").textContent = "大きく"; tDraw(); }
$("#tClose").addEventListener("click", tClose);
$("#tOv").addEventListener("click", (e) => { if (e.target.id === "tOv") tClose(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#tOv").hidden) tClose(); });
$("#tBig").addEventListener("click", () => { const b = $("#tBox").classList.toggle("big"); $("#tBig").textContent = b ? "小さく" : "大きく"; tDraw(); });
$("#tGo").addEventListener("click", () => (T.run ? tStop() : tStart()));
/* 「もどす」は、まちがえて押しても消えないように、2回続けて押したときだけ効く */
$("#tRs").addEventListener("click", () => {
  const b = $("#tRs");
  if (b.classList.contains("arm")) { clearTimeout(armT); b.classList.remove("arm"); b.textContent = "もどす"; tReset(); return; }
  b.classList.add("arm"); b.textContent = "もう一度おすと もどります";
  armT = setTimeout(() => { b.classList.remove("arm"); b.textContent = "もどす"; }, 2500);
});
$("#tSeki").addEventListener("click", () => { T.n = 5; tSetDur(150); });
$("#tBox").addEventListener("click", (e) => {
  const pre = e.target.closest("[data-pre]"), n = e.target.closest("[data-n]"), adj = e.target.closest("[data-adj]");
  if (pre) tSetDur(Number(pre.dataset.pre));
  else if (n) { T.n = Number(n.dataset.n); tReset(); }
  else if (adj) {
    const d = Number(adj.dataset.adj);
    if (T.run) { T.end = Math.max(Date.now() + 1000, T.end + d * 1000); T.dur = Math.max(30, T.dur + d); tSave(); tDraw(); }
    else { const keep = T.left < T.dur && !T.done; T.dur = Math.max(30, Math.min(3600, T.dur + d)); T.left = keep ? Math.max(1, T.left + d) : T.dur; T.done = false; tSave(); tDraw(); }
  }
});
setInterval(tTick, 250);

function route() {
  const h = location.hash.replace(/^#\/?/, "");
  let html, page;
  if (h.startsWith("l/")) { html = lesson(h.slice(2)); page = "lesson"; }
  else if (h === "komatta") { html = komatta(); page = "komatta"; }
  else if (h === "dougu") { html = dougu(); page = "dougu"; }
  else if (h === "kata") { html = kata(); page = "kata"; }
  else if (h === "kimari") { html = kimari(); page = "kimari"; }
  else if (h === "memo") { html = memo(); page = "memo"; }
  else if (h === "fusen") { html = fusen(); page = "fusen"; }
  else if (h === "timer") { html = home(); page = "home"; setTimeout(tOpen, 0); }
  else { html = home(); page = "home"; }
  $("#main").innerHTML = html;
  bottom(page);
  tTick();
  document.querySelectorAll("button.kb").forEach((b) => b.addEventListener("click", () => showK(Number(b.dataset.k))));
  document.querySelectorAll("button.hint").forEach((b) => b.addEventListener("click", () => b.setAttribute("aria-expanded", b.classList.toggle("open"))));
  // 道具箱の見出しへ飛ぶ（アドレスは変えない）
  document.querySelectorAll("[data-j]").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault(); const t = document.getElementById(a.dataset.j); if (t) t.scrollIntoView({ behavior: "smooth" });
  }));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
